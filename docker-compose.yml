version: '3.8'

services:
  statis:
    build:
      context: ./web-statis
      dockerfile: Dockerfile
    container_name: eperpus_statis
    ports:
      - "80:80" # Memetakan port 80 EC2 ke port 80 Container (web statis)
    restart: always

  dinamis:
    build:
      context: ./web-dinamis
      dockerfile: Dockerfile
    container_name: eperpus_dinamis
    ports:
      - "3000:80" # Memetakan port 3000 EC2 ke port 80 Container (web dinamis PHP Apache)
    volumes:
      - ./web-dinamis:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=perpustakaan
      - DB_USER=root
      - DB_PASSWORD=adminsecretpassword # Gunakan password yang kuat untuk AWS
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:10.6 # Menggunakan MariaDB sesuai kriteria penilaian UAS
    container_name: eperpus_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=adminsecretpassword
      - MYSQL_DATABASE=perpustakaan
    # Port 3306 ditutup/tidak diekspos ke publik demi keamanan dan penilaian "Sangat Baik" di UAS
    volumes:
      - db_data:/var/lib/mysql
      # Otomatis mengimport database.sql saat kontainer db pertama kali dibuat
      - ./web-dinamis/database.sql:/docker-entrypoint-initdb.d/database.sql

volumes:
  db_data:


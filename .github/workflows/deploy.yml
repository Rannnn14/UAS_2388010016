name: CI/CD Pipeline UAS

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Filter perubahan path untuk menentukan web mana yang diubah
  changes:
    runs-on: ubuntu-latest
    outputs:
      statis: ${{ steps.filter.outputs.statis }}
      dinamis: ${{ steps.filter.outputs.dinamis }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Path Filter Check
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            statis:
              - 'web-statis/**'
              - 'docker-compose.yml'
            dinamis:
              - 'web-dinamis/**'
              - 'docker-compose.yml'

  # Job 2: Build & Push Web Statis
  build-statis:
    needs: changes 
    if: ${{ needs.changes.outputs.statis == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Static Image
        uses: docker/build-push-action@v4
        with:
          context: ./web-statis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uas_2388010016:latest

  # Job 3: Build & Push Web Dinamis
  build-dinamis:
    needs: changes
    if: ${{ needs.changes.outputs.dinamis == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Dynamic Image
        uses: docker/build-push-action@v4
        with:
          context: ./web-dinamis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uas_dinamis_2388010016:latest

  # Job 4: Auto-Deploy ke AWS EC2 (Zero-Touch Deployment)
  deploy:
    needs: [build-statis, build-dinamis]
    if: always() && (needs.build-statis.result == 'success' || needs.build-dinamis.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app/"

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            # Login ke Docker Hub agar bisa menarik image terbaru
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            # Tarik image terbaru
            docker compose pull
            # Jalankan kontainer dengan downtime minimal (Zero-Touch)
            docker compose up -d --remove-orphans 